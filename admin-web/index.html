<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeafCheck AI administration console for SuperAdmin and Lead_Dev." />
    <title>LeafCheck AI | Admin</title>
    <script>
      try {
        const theme = localStorage.getItem('leafcheck-admin-theme');
        document.documentElement.classList.toggle('dark', theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch { /* The app also supports browsers without persistent storage. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
