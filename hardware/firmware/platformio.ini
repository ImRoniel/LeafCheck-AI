; PlatformIO Project Configuration File
; LeafCheck ESP32 Hardware Firmware
;
; Sensors:
;   - SHT31     (I2C 0x44) — Temperature & Humidity
;   - BH1750    (I2C 0x23) — Ambient Light (Lux)
;   - Capacitive Soil Moisture (Analog GPIO 34)
;
; Transport: HTTP POST → Express Backend via WiFi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit BusIO @ ^1.16.1
    claws/BH1750 @ ^1.3.0
